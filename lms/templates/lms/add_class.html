<!DOCTYPE html>
<html>
<head>
    <title>Add New Class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Override navbar background color */
        .navbar.bg-dark {
        background-color: #003f5c !important;
        }
        /* Navbar text color */
        .navbar .navbar-brand,
        .navbar .nav-link {
        color: #ffffff !important; /* or any color you prefer, e.g., #f0f0f0 */
        }
        /* Optional: change hover color */
        .navbar .nav-link:hover {
        color: #cccccc !important;
        }
        .bottom-clock {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.8rem;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .card-header {
            background-color: #003f5c;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Classroom LMS | Andhivie</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'add_class' %}">Add Class</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'charts' %}">Charts</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'custom_logout' %}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card shadow">
            <div class="card-header">
                <h3 class="mb-0">Add New Class</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Class Name *</label>
                        <input type="text" name="name" id="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="semester" class="form-label">Semester *</label>
                        <select name="semester" id="semester" class="form-select" required>
                            <option value="">-- Select Semester --</option>
                            {% for sem in semesters %}
                                <option value="{{ sem.id }}">{{ sem.name }} ({{ sem.start_date|date:"M d, Y" }} - {{ sem.end_date|date:"M d, Y" }})</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">If no semester exists, create one via admin panel.</div>
                    </div>
                    <div class="mb-3">
                        <label for="schedule" class="form-label">Schedule (optional)</label>
                        <input type="text" name="schedule" id="schedule" class="form-control" placeholder="e.g., Mon/Wed 9:00-10:30">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Create Class</button>
                        <a href="#" id="cancelToDashboardBtn" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="bottom-clock" id="live-clock"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== ACTIVITY LOG ==========
function addActivityLog(action) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const logs = JSON.parse(localStorage.getItem('activityLog') || '[]');
    logs.unshift({ action, time: timeStr });
    if (logs.length > 20) logs.pop(); // simpan maksimal 20 aktivitas
    localStorage.setItem('activityLog', JSON.stringify(logs));

    // Jika elemen recentActivityList ada (di sidebar dashboard), perbarui langsung
    const logContainer = document.getElementById('recentActivityList');
    if (logContainer) {
        logContainer.innerHTML = '';
        logs.slice(0, 3).forEach(log => {
            logContainer.innerHTML += `
                <div class="py-1">
                    <i class="bi bi-dot me-1"></i> ${log.action}
                    <span class="text-muted ms-1">(${log.time})</span>
                </div>`;
        });
    }
}
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('live-clock').innerText = now.toLocaleDateString('id-ID', options);
        }
        updateClock();
        setInterval(updateClock, 1000);

        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                setTimeout(function() {
                    const closeButton = alert.querySelector('.btn-close');
                    if (closeButton) closeButton.click();
                    else alert.style.display = 'none';
                }, 10000);
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            const cancelBtn = document.getElementById('cancelToDashboardBtn');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const classId = localStorage.getItem('selectedClassId');
                let url = "{% url 'dashboard' %}";
                if (classId) {
                    url += "?class_id=" + encodeURIComponent(classId);
                }
                window.location.href = url;
            });
        }
    });
    </script>
</body>
</html>
