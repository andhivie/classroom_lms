<!DOCTYPE html>
<html>
<head>
    <title>Login - Classroom LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
        }

        /* Efek blur dan overlay gradien */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 100%);
            backdrop-filter: blur(10px);
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 20px;
        }

        /* Animasi fade-in untuk welcome text */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            animation: fadeInUp 0.8s ease-out;
        }

        .welcome-text h3 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
        }

        .welcome-text p {
            font-size: 1.1rem;
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 0;
        }

        /* Garis dekoratif */
        .divider {
            width: 60px;
            height: 3px;
            background: rgba(255,255,255,0.5);
            margin: 15px auto 0;
            border-radius: 3px;
        }

        /* Card login */
        .card {
            border-radius: 28px;
            background-color: rgba(255, 255, 255, 0.96);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: none;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card-header {
            background: linear-gradient(135deg, #1e2a3a, #0f1724);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-bottom: none;
        }

        .card-header i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
        }

        .card-header h4 {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 1px;
        }

        .card-body {
            padding: 2rem;
        }

        /* Form styling */
        .form-label {
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 8px;
            margin-left: 10px;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-radius: 50px 0 0 50px;
            border-right: none;
            color: #1e2a3a;
        }

        .form-control {
            border-radius: 0 50px 50px 0;
            border-left: none;
            padding: 12px 20px;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #1e2a3a;
            box-shadow: 0 0 0 0.2rem rgba(30,42,58,0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #1e2a3a, #0f1724);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #2c3e50, #1a252f);
        }

        /* Footer */
        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .card-body {
                padding: 1.5rem;
            }
            .welcome-text h3 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="welcome-text">
                    <h3>Welcome to Classroom LMS</h3>
                    <p>by Andhivie</p>
                    <div class="divider"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <h4>Login</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" id="username" placeholder="Enter your username" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-login btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
                <div class="footer-note">
                    &copy; 2026 Andhivie - All rights reserved.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
